# XcodeGen spec — the .xcodeproj is GENERATED from this file.
# After adding/removing source files, run:  xcodegen generate
name: Bookbinder
options:
  bundleIdPrefix: com.aimeepepper
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Bookbinder:
    type: application
    platform: iOS
    # Signing lives here so regenerating the project can't clobber it. See the file.
    configFiles:
      Debug: Support/Signing.xcconfig
      Release: Support/Signing.xcconfig
    sources:
      - path: Sources
      - path: Support/LaunchScreen.storyboard
        buildPhase: resources
      - path: RuntimePacks/TerrainProductionPack-v1
        buildPhase: resources
        type: folder
      - path: RuntimePacks/TerrainSouthWallPack-v1
        buildPhase: resources
        type: folder
      - path: RuntimePacks/ExplorationMapIdentities-v1
        buildPhase: resources
        type: folder
      - path: RuntimePacks/ExplorationLooseItems-v1
        buildPhase: resources
        type: folder
      - path: RuntimePacks/ExplorationCatalogueObjects-v1
        buildPhase: resources
        type: folder
      - path: RuntimePacks/ExplorationLooseEssence-v1
        buildPhase: resources
        type: folder
      - path: AssetLab/integration/writing-desk-production-pack-v1/runtime
        name: WritingDeskProductionPack-v1
        buildPhase: resources
        type: folder
      - path: AssetLab/artifacts/writing-parchment-v1/runtime/writing.parchment.handmade-v1-172x172.png
        buildPhase: resources
      - path: AssetLab/fonts/Jersey10-Regular.ttf
        buildPhase: resources
      - path: AssetLab/fonts/Tiny5-Regular.ttf
        buildPhase: resources
      - path: AssetLab/integration/starting-town-home-v1/starting-town-home-v1.json
        buildPhase: resources
      - path: AssetLab/integration/starting-town-home-v1/town-starting-home-v1-phone-v2.png
        buildPhase: resources
      - path: AssetLab/integration/named-character-placeholders-v1/manifest.json
        name: named-character-placeholders-v1.json
        buildPhase: resources
    preBuildScripts:
      - name: Verify repository organization
        basedOnDependencyAnalysis: false
        script: |
          python3 "$SRCROOT/Scripts/verify_repository_organization.py" --check
        inputFiles:
          - $(SRCROOT)/Scripts/verify_repository_organization.py
      - name: Verify generated combat-v2 authority
        basedOnDependencyAnalysis: false
        script: |
          python3 "$SRCROOT/Scripts/generate_combat_tree_v2.py" --check
        inputFiles:
          - $(SRCROOT)/Scripts/generate_combat_tree_v2.py
          - $(SRCROOT)/docs/combat-tree-v2-authority.json
          - $(SRCROOT)/docs/combat-tree-v2-effect-copy.generated.json
          - $(SRCROOT)/docs/combat-tree-node-copy-current.md
          - $(SRCROOT)/Sources/Content/Data/combat_trees.json
          - $(SRCROOT)/Sources/Content/Data/combat_tree_v2.json
    postBuildScripts:
      - name: Preserve named-character runtime filename
        basedOnDependencyAnalysis: false
        script: |
          mv -f "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/manifest.json" \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/named-character-placeholders-v1.json"
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/manifest.json
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/named-character-placeholders-v1.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aimeepepper.bookbinder
        PRODUCT_NAME: Bookbinder
        CURRENT_PROJECT_VERSION: 234
        MARKETING_VERSION: "0.1"
        TARGETED_DEVICE_FAMILY: "1" # iPhone only — portrait, one-handed (pillar 3)
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM deliberately lives in Support/Signing.xcconfig, NOT here.
        #
        # The .xcodeproj is generated, so anything set here — or picked in Xcode's Signing & 
        # Capabilities tab — is overwritten the next time `xcodegen generate` runs. Hardcoding a
        # team ID here meant every regeneration re-broke signing. The xcconfig is a plain file
        # xcodegen never rewrites, so a choice made there survives.
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      # Generated by xcodegen — kept outside Sources/ so it is never copied in as a resource.
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Bookbinder
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchStoryboardName: LaunchScreen
        UIAppFonts:
          - Jersey10-Regular.ttf
          - Tiny5-Regular.ttf
        UIApplicationSupportsIndirectInputEvents: true
        # Portrait only — pillar 3. Do not add landscape without a design decision.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        # Save file lives in Documents; expose it so Aimee can pull/inspect saves over USB.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    scheme:
      testTargets:
        - BookbinderTests
        - BookbinderUITests
      gatherCoverageData: false

  BookbinderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - TalinGambitTests.swift
    dependencies:
      - target: Bookbinder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aimeepepper.bookbinder.tests

  BookbinderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Bookbinder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aimeepepper.bookbinder.uitests
