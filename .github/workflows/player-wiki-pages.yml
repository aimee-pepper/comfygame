name: Deploy Player Wiki to GitHub Pages

on:
  push:
    branches:
      - main
      - codex/player-wiki-github-pages-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-wiki-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: PlayerWiki/package-lock.json

      - name: Install dependencies
        working-directory: PlayerWiki
        run: npm ci

      - name: Run player-wiki tests
        working-directory: PlayerWiki
        run: npm test

      - name: Build static player wiki
        working-directory: PlayerWiki
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: PlayerWiki/dist/client

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
